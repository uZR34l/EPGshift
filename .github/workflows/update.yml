name: Update EPG
permissions:
  contents: write
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        run: python --version

      - name: Generate EPG
        run: python shift_epg.py

      - name: Save EPG
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add epg.xml
          git commit -m "Update EPG" || exit 0
          git push
